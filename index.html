<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPANET Pyodide + Cytoscape PoC - Dynamic Load</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <!-- epanet-js libraries -->
    <script src="https://unpkg.com/@model-create/epanet-engine@0.5.0/dist/epanet-engine.js"></script>
    <script src="https://unpkg.com/epanet-js@0.6.0/dist/epanet.js"></script>
    <style>
        body { 
            font-family: 'Roboto', sans-serif; /* Material Design font */
            margin: 0; 
            padding: 0;
            background-color: #fcfcff; /* Light background */
            color: #1f1f1f; /* Dark text */
        }
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        h1 {
            color: #386a20; /* Material Design primary color variant */
            font-weight: 400;
        }
        #cy {
            width: 100%;
            height: 500px; /* Increased height */
            border: 1px solid #ccc; /* Softer border */
            display: block;
            margin-top: 20px;
            margin-bottom: 20px;
            background-color: #fff; /* White background for graph */
        }
        /* Basic MD3-like button styling */
        .md-button {
            background-color: #e8def8; /* Material Design secondary container */
            color: #1d192b; /* On secondary container text color */
            border: none;
            padding: 10px 24px;
            border-radius: 20px; /* Fully rounded corners for "pill" shape */
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: none; /* MD3 buttons often don't use uppercase */
            cursor: pointer;
            transition: background-color 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px; /* Spacing between buttons */
        }
        .md-button:hover {
            background-color: #d0c8e0; /* Slightly darker on hover */
        }
        #output { 
            margin-top: 15px; 
            padding: 12px; 
            border: 1px solid #e0e0e0; 
            background-color: #f5f5f5; 
            min-height: 40px;
            border-radius: 8px;
        }
        #fileNameDisplay {
            margin-left: 10px;
            font-style: italic;
            color: #555;
        }
        .file-input-area {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPANET Network Visualization</h1>
        
        <div class="file-input-area">
            <input type="file" id="inpFile" accept=".inp" style="display: none;">
            <button id="loadInpBtn" class="md-button">Load .INP File</button>
            <span id="fileNameDisplay">No file selected.</span>
        </div>
        
        <!-- Removed the old run_simulation_btn as loading and displaying is the primary action now -->
        <!-- The simulation logic can be triggered after successful topology display if needed, or by another button -->
        
        <div id="output">Select an .INP file to display its topology.</div>

        <div id="cy"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
